[package]
name = "p2pc-wsl"
description = "P2PC WSL management for the desktop app: checks, distro import, upgrade, uninstall (H2)."
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Every dependency below is already in the workspace (and in the lock file); none is new to the tree.
[dependencies]
# PowerShell's `-EncodedCommand` (base64 of UTF-16LE): the probe scripts never go through command-line quoting.
data-encoding.workspace = true
# The image download (H2 §8.3: HTTP range resume). The blocking client, like the rest of this crate (it drives
# `wsl.exe` synchronously); the app calls it from a blocking thread. TLS is rustls with `ring` and the OS store, as in
# `p2pc-client`.
reqwest = { workspace = true, features = ["blocking"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
# `/var/lib/p2pc/boot-status.json`, read exactly (install.ps1 used regular expressions only because of PowerShell 5.1).
serde.workspace = true
serde_json.workspace = true
# SHA-256 of the image (H1 §9.0: the rootfs is pinned and hash-verified).
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Bytes written to a child's stdin (a later task feeds the join token that way) are wiped when dropped.
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
