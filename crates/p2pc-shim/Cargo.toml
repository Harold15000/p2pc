[package]
name = "p2pc-shim"
description = "Static (musl) helper injected into every P2PC job sandbox."
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "p2pc-shim"
path = "src/main.rs"

# Deliberately tiny (spec §9 "Shim"): std, rustix for waitpid/kill/subreaper, and signal-hook for safe signal
# handlers. No async runtime and no argument parser: the bridge uses a thread per connection.
[dependencies]
rustix = { workspace = true, features = ["process"] }
signal-hook.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
