# Transcribe audio: whisper.cpp as a batch job (H2 spec §7.6 "Templates shipped with the beta").
#
# The image is the upstream `ghcr.io/ggml-org/whisper.cpp:main-cuda` (3.72 GB, ffmpeg included), pinned by digest. It was
# checked on a test node with plain Podman, through a logging CONNECT proxy: ffmpeg is at /usr/bin/ffmpeg and the
# whisper binaries are in /app/build/bin. The `small` model (466 MB) comes from `huggingface.co`, redirected to
# `us.aws.cdn.hf.co`; `hf.co` covers it because an egress entry matches its subdomains. To move the digest, take the new
# one from the registry (`skopeo inspect` or `crane digest`), raise `bundle_version` in `bundle.toml` and run
# `templates-bundle check --release`.
#
# OPEN ITEMS:
#  - `transcribe.sh` calls the CLI as `whisper-cli` (the name in current upstream), falling back to
#    /app/build/bin/whisper-cli. The name inside this digest was not confirmed against the upstream Dockerfile or by a
#    run of the script on the image: run it once on the test node.
#  - Models are downloaded without a checksum. Record the SHA-256 of base, small and medium so the script can verify them.

id = "transcribe"
version = 1
title = "Transcribe audio"
description = "Turn a recording into text with Whisper, on your own computers. You get the transcript as plain text and as subtitles (SRT and VTT). The medium model needs about 5 GB of video memory."
kind = "batch"
ui = "transcribe"
licenses = [
  "whisper.cpp: MIT",
  "Whisper models: MIT",
  "FFmpeg in the image: LGPL-2.1-or-later, or GPL when built with GPL parts",
]
# The 3.72 GB image (about 3550 MiB) plus the default `small` model (466 MB, counted as 466 MiB to stay on the safe side).
download_mb = 4050

[requirements]
gpu = "preferred"
min_vram_mb = 2048

# The recording. It becomes the file /inputs/audio, read-only.
[[params]]
name = "audio"
label = "Audio file"
type = "blob"
target = "input:/inputs/audio"

# The spoken language, or `auto` to let the model detect it. The script checks it again before using it.
[[params]]
name = "language"
label = "Language"
type = "enum"
values = ["auto", "en", "es", "fr", "de", "it", "pt", "nl", "pl", "ru", "uk", "tr", "ar", "hi", "zh", "ja", "ko"]
default = "auto"
target = "env:LANGUAGE"

[[params]]
name = "model"
label = "Model"
type = "enum"
values = ["base", "small", "medium"]
default = "small"
target = "env:MODEL"

[spec]
name = "Transcribe audio"
# `main-cuda`.
image = "ghcr.io/ggml-org/whisper.cpp@sha256:fe01def3d6e6f1463eb94b7bcdbe93a5e65fbfd51381050f0b0d77601b18bb1f"
command = ["/bin/sh", "/inputs/.template/transcribe.sh"]
# One hour fits the daily caps this template is meant for (it is a batch job, 1 s to 24 h).
timeout_s = 3600

# The two values below are the defaults; the parameters replace them whole.
[spec.env]
LANGUAGE = "auto"
MODEL = "small"

[spec.resources]
cpu = 4
memory_mb = 4096
gpu = 1
disk_mb = 4096

# Fixed by the template: where the script downloads a model from (Hugging Face, which redirects the file to a CDN host
# under hf.co, `us.aws.cdn.hf.co` on the test node).
[spec.egress]
allow = ["huggingface.co", "hf.co"]

# The fixed script, read-only in the container. `from` is read from this directory by the bundle compiler.
[[spec.files]]
path = "/inputs/.template/transcribe.sh"
from = "transcribe/transcribe.sh"

[[spec.volumes]]
name = "tpl:transcribe/models"
mount = "/volumes/models"
max_mb = 5120
