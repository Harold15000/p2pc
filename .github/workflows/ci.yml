name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# The Rust toolchain is pinned in rust-toolchain.toml: rustup installs it (with rustfmt and clippy) on first use.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: cargo test --locked --workspace
      # Feature-gated tests too, for example the OpenAPI schema test behind p2pc-proto's `openapi` feature.
      - run: cargo test --locked --workspace --all-features
      # The egress proxy's real unix-socket test is #[ignore]d because the AI development sandbox forbids AF_UNIX.
      - run: cargo test --locked -p p2pc-agent --lib -- --ignored egress::tests::unix_socket

  spdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: scripts/check-spdx.sh

  # Spec §10: iroh's `portmapper` feature (UPnP, NAT-PMP) must never be compiled in.
  iroh-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: scripts/check-iroh-features.sh

  # deploy/ and scripts/: shellcheck, bash -n, SPDX, the PowerShell parse of the Windows installer (pwsh ships on
  # ubuntu-latest), systemd-analyze on the server unit, and the unit tests of the image builder, boot script, node
  # test, host setup helpers, server installer and release script.
  deploy:
    runs-on: ubuntu-latest
    env:
      CHECK_REQUIRE_PWSH: "1"
      CHECK_REQUIRE_SYSTEMD_ANALYZE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: deploy/check.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --locked --release -p p2pc-shim --target x86_64-unknown-linux-musl
