#
# Railway config as code for the relay (H2 spec §10.2). Set the service's root directory to `deploy/relay`; see
# README.md. Nothing here names an account, a project or a domain.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# iroh-relay's plain HTTP probe route: 200 when the relay is up.
healthcheckPath = "/ping"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
