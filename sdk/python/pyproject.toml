[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "p2pc"
version = "0.1.1"
description = "Python SDK for the P2PC personal compute cloud (Jobs API)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "P2PC contributors" }]
keywords = ["p2pc", "compute", "jobs", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["p2pc"]

[tool.hatch.build.targets.sdist]
include = ["p2pc", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "S", "ASYNC", "RUF", "PT", "C4", "PERF", "TID",
]

ignore = [
    # `timeout=` on async methods is part of the public API (same surface as the sync client);
    # it is implemented with a monotonic deadline, not asyncio.timeout.
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and synthetic, obviously fake credentials.
"tests/**" = ["S101", "S105", "S106", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["p2pc"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
