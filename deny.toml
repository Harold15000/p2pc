# cargo-deny policy. Protected file: only maintainers change it.
[graph]
all-features = true
# Only the platforms P2PC builds for. iroh-relay's wasm32-only dependencies (ws_stream_wasm, async_io_stream and
# pharos, all Unlicense) are never compiled for these targets (T05, 05-11).
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"
ignore = [
  # paste 1.0.15: unmaintained, with no known vulnerability. It is a build-time proc-macro of netlink-packet-core,
  # pulled in by netwatch, which iroh 1.4 requires on Linux. Revisit when iroh drops it (T05, 05-11).
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, no vulnerability; build-time proc-macro via netwatch (iroh 1.4)" },
  # libsqlite3-sys 0.37 (bundled SQLite < 3.54): uninitialized page-cache memory when a process opens a database with
  # a sibling -wal file of a different page size that a less trusted party wrote. p2pc-server opens only its own
  # database, in its state directory, owned by its service user: writing there already means owning the server. The
  # fix (libsqlite3-sys >= 0.39) needs a sqlx-sqlite release that allows it; 0.9.0, the latest, caps it below 0.38.
  # Remove this entry and upgrade as soon as sqlx releases it. Do not restore a backup from an untrusted source.
  { id = "RUSTSEC-2026-0459", reason = "bundled SQLite WAL page-size bug; server opens only its own DB; fix blocked on a sqlx release" },
]

[licenses]
# Permissive licenses only. MPL-2.0 is accepted for unmodified dependencies (file-level copyleft).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are `publish = false` and carry their own license (AGPL-3.0-only for p2pc-server).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
